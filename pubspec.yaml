name: trackme
description: Smart Campus Transportation & Live Location App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI & Styling
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  font_awesome_flutter: ^10.7.0
  lottie: ^3.1.0

  # State Management
  provider: ^6.1.1

  # Firebase Backend
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  firebase_messaging: ^14.7.19

  # Location & Maps
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  url_launcher: ^6.2.5

  # QR Code & Utilities
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
