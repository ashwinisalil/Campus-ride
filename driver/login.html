<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusRide - Driver Management</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f6fb;
        }

        header {
            background: #1b6dc1;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        h2 {
            color: #1b6dc1;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1b6dc1;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            opacity: 0.85;
        }

        .add-btn {
            background: #198754;
        }

        .update-btn {
            background: #0d6efd;
        }

        .delete-btn {
            background: #dc3545;
        }

        .clear-btn {
            background: #6c757d;
        }

        .refresh-btn {
            background: #1b6dc1;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #1b6dc1;
            color: white;
        }

        tr:nth-child(even) {
            background: #f5f5f5;
        }

    </style>
</head>


<body>


    <header>

        <h1>
            CampusRide - Driver Management
        </h1>

    </header>


    <div class="container">


        <!-- DRIVER FORM -->

        <div class="card">

            <h2>
                Driver Details
            </h2>


            <div class="form-group">

                <label for="driver_id">
                    Driver ID
                </label>

                <input
                    type="number"
                    id="driver_id"
                    placeholder="Enter Driver ID for update/delete"
                >

            </div>


            <div class="form-group">

                <label for="user_id">
                    User ID
                </label>

                <input
                    type="number"
                    id="user_id"
                    placeholder="Enter User ID"
                >

            </div>


            <div class="form-group">

                <label for="license_number">
                    License Number
                </label>

                <input
                    type="text"
                    id="license_number"
                    placeholder="Enter License Number"
                >

            </div>


            <div class="form-group">

                <label for="assigned_bus_id">
                    Assigned Bus ID
                </label>

                <input
                    type="number"
                    id="assigned_bus_id"
                    placeholder="Enter Assigned Bus ID"
                >

            </div>


            <button
                class="add-btn"
                onclick="addDriver()"
            >
                Add Driver
            </button>


            <button
                class="update-btn"
                onclick="updateDriver()"
            >
                Update Driver
            </button>


            <button
                class="delete-btn"
                onclick="deleteDriver()"
            >
                Delete Driver
            </button>


            <button
                class="clear-btn"
                onclick="clearForm()"
            >
                Clear
            </button>


            <div id="message"></div>

        </div>


        <!-- DRIVER LIST -->

        <div class="card">

            <h2>
                All Drivers
            </h2>


            <button
                class="refresh-btn"
                onclick="getDrivers()"
            >
                Refresh Driver List
            </button>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Driver ID
                            </th>

                            <th>
                                User ID
                            </th>

                            <th>
                                License Number
                            </th>

                            <th>
                                Assigned Bus ID
                            </th>

                        </tr>

                    </thead>


                    <tbody id="driverTable">

                    </tbody>

                </table>

            </div>

        </div>


    </div>


    <script>


        // DISPLAY MESSAGE

        function showMessage(
            message,
            isSuccess
        ) {

            const messageBox =
                document.getElementById(
                    "message"
                );


            messageBox.innerText =
                message;


            if (isSuccess) {

                messageBox.style.color =
                    "green";

            } else {

                messageBox.style.color =
                    "red";

            }

        }


        // ADD DRIVER
        // Connects to add_driver.php

        function addDriver() {


            const user_id =
                document.getElementById(
                    "user_id"
                ).value;


            const license_number =
                document.getElementById(
                    "license_number"
                ).value;


            const assigned_bus_id =
                document.getElementById(
                    "assigned_bus_id"
                ).value;


            if (
                user_id === "" ||
                license_number === "" ||
                assigned_bus_id === ""
            ) {

                showMessage(
                    "Please fill all required fields",
                    false
                );

                return;

            }


            const formData =
                new FormData();


            formData.append(
                "user_id",
                user_id
            );


            formData.append(
                "license_number",
                license_number
            );


            formData.append(
                "assigned_bus_id",
                assigned_bus_id
            );


            fetch(
                "add_driver.php",
                {
                    method: "POST",
                    body: formData
                }
            )


            .then(
                response => response.json()
            )


            .then(
                data => {


                    showMessage(
                        data.message,
                        data.status === "success"
                    );


                    if (
                        data.status ===
                        "success"
                    ) {

                        clearForm();

                        getDrivers();

                    }

                }
            )


            .catch(
                error => {

                    showMessage(
                        "Error connecting to server",
                        false
                    );

                    console.log(error);

                }
            );

        }


        // GET DRIVERS
        // Connects to get_driver.php

        function getDrivers() {


            fetch(
                "get_driver.php"
            )


            .then(
                response => response.json()
            )


            .then(
                data => {


                    const table =
                        document.getElementById(
                            "driverTable"
                        );


                    table.innerHTML =
                        "";


                    data.forEach(
                        driver => {


                            const row =
                                document.createElement(
                                    "tr"
                                );


                            row.innerHTML = `

                                <td>
                                    ${driver.driver_id}
                                </td>

                                <td>
                                    ${driver.user_id}
                                </td>

                                <td>
                                    ${driver.license_number}
                                </td>

                                <td>
                                    ${driver.assigned_bus_id}
                                </td>

                            `;


                            table.appendChild(
                                row
                            );

                        }
                    );

                }
            )


            .catch(
                error => {

                    showMessage(
                        "Unable to load drivers",
                        false
                    );

                    console.log(error);

                }
            );

        }


        // UPDATE DRIVER
        // Connects to update_driver.php

        function updateDriver() {


            const driver_id =
                document.getElementById(
                    "driver_id"
                ).value;


            const user_id =
                document.getElementById(
                    "user_id"
                ).value;


            const license_number =
                document.getElementById(
                    "license_number"
                ).value;


            const assigned_bus_id =
                document.getElementById(
                    "assigned_bus_id"
                ).value;


            if (
                driver_id === "" ||
                user_id === "" ||
                license_number === "" ||
                assigned_bus_id === ""
            ) {

                showMessage(
                    "Please fill all fields",
                    false
                );

                return;

            }


            const formData =
                new FormData();


            formData.append(
                "driver_id",
                driver_id
            );


            formData.append(
                "user_id",
                user_id
            );


            formData.append(
                "license_number",
                license_number
            );


            formData.append(
                "assigned_bus_id",
                assigned_bus_id
            );


            fetch(
                "update_driver.php",
                {
                    method: "POST",
                    body: formData
                }
            )


            .then(
                response => response.json()
            )


            .then(
                data => {


                    showMessage(
                        data.message,
                        data.status === "success"
                    );


                    if (
                        data.status ===
                        "success"
                    ) {

                        clearForm();

                        getDrivers();

                    }

                }
            )


            .catch(
                error => {

                    showMessage(
                        "Error connecting to server",
                        false
                    );

                    console.log(error);

                }
            );

        }


        // DELETE DRIVER
        // Connects to delete_driver.php

        function deleteDriver() {


            const driver_id =
                document.getElementById(
                    "driver_id"
                ).value;


            if (
                driver_id === ""
            ) {

                showMessage(
                    "Enter Driver ID to delete",
                    false
                );

                return;

            }


            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this driver?"
                );


            if (
                !confirmDelete
            ) {

                return;

            }


            const formData =
                new FormData();


            formData.append(
                "driver_id",
                driver_id
            );


            fetch(
                "delete_driver.php",
                {
                    method: "POST",
                    body: formData
                }
            )


            .then(
                response => response.json()
            )


            .then(
                data => {


                    showMessage(
                        data.message,
                        data.status === "success"
                    );


                    if (
                        data.status ===
                        "success"
                    ) {

                        clearForm();

                        getDrivers();

                    }

                }
            )


            .catch(
                error => {

                    showMessage(
                        "Error connecting to server",
                        false
                    );

                    console.log(error);

                }
            );

        }


        // CLEAR FORM

        function clearForm() {


            document.getElementById(
                "driver_id"
            ).value =
                "";


            document.getElementById(
                "user_id"
            ).value =
                "";


            document.getElementById(
                "license_number"
            ).value =
                "";


            document.getElementById(
                "assigned_bus_id"
            ).value =
                "";


            document.getElementById(
                "message"
            ).innerText =
                "";

        }


        // LOAD DRIVER DATA
        // When page opens

        window.onload =
            function() {

                getDrivers();

            };


    </script>


</body>

</html>
