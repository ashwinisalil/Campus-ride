<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            width:400px;
            background:#fff;
            padding:40px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        .login-box h2{
            text-align:center;
            margin-bottom:30px;
            color:#333;
        }

        .input-group{
            margin-bottom:20px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#555;
        }

        .input-group input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        .input-group input:focus{
            border-color:#4facfe;
            outline:none;
        }

        .btn{
            width:100%;
            padding:12px;
            background:#4facfe;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            background:#008cff;
        }

        .footer{
            text-align:center;
            margin-top:20px;
        }

        .footer a{
            text-decoration:none;
            color:#4facfe;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Student Login</h2>

    <form action="student_login.php" method="POST">

        <div class="input-group">
            <label>Student ID</label>
            <input type="text"
                   name="student_id"
                   placeholder="Enter Student ID"
                   required>
        </div>

        <div class="input-group">
            <label>User ID</label>
            <input type="text"
                   name="user_id"
                   placeholder="Enter User ID"
                   required>
        </div>

        <button type="submit" class="btn">
            Login
        </button>

    </form>

    <div class="footer">
        Forgot Login? <a href="#">Contact Admin</a>
    </div>

</div>

</body>
</html>
