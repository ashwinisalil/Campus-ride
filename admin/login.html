<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body { background: linear-gradient(135deg, #eef7ff, #f8fbff); min-height: 100vh; display:flex; align-items:center; justify-content:center; }

  <body>
    <div class="card p-4 p-md-5">
      <h2 class="mb-3">Admin Login</h2>
      <p class="text-muted">Manage buses, routes, drivers and live tracking.</p>
      <form action="login.php" method="post" class="mb-3">
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="admin@example.com" required />

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required />

        <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
      </form>
      <a class="btn btn-secondary" href="../index.html">Back to Home</a>
